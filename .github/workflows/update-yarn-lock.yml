name: Update yarn.lock
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  update-yarn-lock:
    name: Update yarn.lock file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: yarn install
        run: yarn install
      - name: pull-request
        uses: peter-evans/create-pull-request@v4
        with:
          title: "Update yarn.lock"
          branch: update-yarn-lock
          delete-branch: true
          # Use the run-scoped token; do not require a PAT that bypasses branch protection.
          token: ${{ github.token }}
